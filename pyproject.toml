[project]
name = "ambient-rainfall"
version = "0.1.0"
description = "A wrapper around the Ambient Weather API for pulling historical station data and calculating rainfall totals over a date range."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Tony Rice", email = "rtphokie@gmail.com" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "ambient-api>=1.5.7",
    "diskcache>=5.6.3",
    "python-dotenv>=1.2.2",
    "tzlocal>=5.4.4",
]

[project.urls]
Repository = "https://github.com/<you>/ambient-rainfall"

[project.scripts]
ambient-rainfall = "ambient_rainfall.core:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.0",
    "tzdata>=2025.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ambient_rainfall"]
